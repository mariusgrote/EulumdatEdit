[package]
name = "eulumdat-edit"
version = "0.1.0"
description = "A modern EULUMDAT (.ldt) editor and viewer"
authors = ["Marius Grote"]
edition = "2021"
rust-version = "1.77"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "eulumdat_edit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
eulumdat-core = { git = "https://github.com/mariusgrote/eulumdat-core.git", branch = "main", features = ["generate-svg"] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
